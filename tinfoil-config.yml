# Tinfoil Container Configuration
# For updates: edit this file, commit, run the Tinfoil Release workflow (e.g. v0.0.2)
cvm-version: "0.14.19"
cpus: 2
memory: 2048

attested-keys:
  - id: probe-signing
    key: ed25519
    uid: 65532
    gid: 65532

containers:
  - name: "probe"
    image: "ghcr.io/smledbetter/kestrel-probe@sha256:d7e146b46230ff18d43268f1e56bb158150f902f5b2ba38ebbbb45ec55b6b233"
    attestation: true
    keys: [probe-signing]

shim:
  upstream-port: 8080
  paths:
    - /ping
    - /attest
    - /sign
